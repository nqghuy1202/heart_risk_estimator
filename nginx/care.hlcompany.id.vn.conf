# Nginx reverse proxy CHẠY TRÊN CHÍNH VPS (không phải container) — dùng chung VPS đang chạy
# debt-crusher và financal_management, thêm subdomain riêng cho app này. Copy file này vào
# /etc/nginx/sites-available/hlcare, symlink sang sites-enabled, rồi chạy
# `certbot --nginx -d care.hlcompany.id.vn` (xem DEPLOY.md) — certbot sẽ tự thêm block 443 +
# redirect 80->443 vào đúng file này, không cần sửa tay.
#
# Django (gunicorn) phục vụ cả /api/* lẫn trang shell React trên CÙNG một cổng, nên chỉ cần 1
# location duy nhất.

server {
    listen 80;
    listen [::]:80;
    server_name care.hlcompany.id.vn;

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
